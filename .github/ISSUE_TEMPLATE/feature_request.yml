name: Feature request
description: Suggest a Windows product or engineering improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What intraoral-camera workflow does this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Product area
      options:
        - Preview and capture
        - Image management
        - Camera settings
        - Windows packaging
        - Documentation
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. What workaround or other approach did you consider?

